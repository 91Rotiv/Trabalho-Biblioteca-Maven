<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">

    <title>Livros</title>
</head>
<body>

<nav>
    <a class="botao secundario" th:href="@{/livros}">Livros</a>
    <a class="botao" th:href="@{/livros/novo}">Cadastrar Livro</a>
    <a class="botao" th:href="@{/autores/novo}">Cadastrar Autor</a>
</nav>

<main>

<h1>Livros</h1>

<p th:if="${livros.isEmpty()}">Nenhum livro cadastrado.</p>

<table th:unless="${livros.isEmpty()}">
    <thead>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="livro : ${livros}">
        <td th:text="${livro.titulo}"></td>
        <td th:text="${livro.autor}"></td>
        <td th:text="${livro.isbn}"></td>
    </tr>
    </tbody>
</table>

</main>

</body>
</html>
